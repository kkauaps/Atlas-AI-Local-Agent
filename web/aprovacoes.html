<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas - Aprovações</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/ui.css">
<style>
 body{padding:24px;max-width:960px;margin:0 auto}
 .tabs button{margin-right:6px}
 .card{border:1px solid var(--line,#333);border-radius:10px;padding:12px 14px;margin:10px 0}
 .card pre{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;font-size:12px}
 .meta{opacity:.7;font-size:12px}
 .acoes button{margin-right:8px}
 .vazio{opacity:.6;padding:20px 0}
</style>
</head>
<body>
<header><a href="/">&larr; Atlas</a> <h2 style="display:inline;margin-left:12px">Aprovações</h2></header>
<p class="meta">Ações que saem do Atlas (posts, e-mails, push, escrita) esperam aqui. Nada roda sem você aprovar.</p>
<div class="tabs">
 <button data-e="pending">Pendentes</button><button data-e="">Todas</button>
 <button id="verJobs">Jobs</button>
</div>
<div id="lista"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let filtro = "pending";
async function carregar() {
  const r = await fetch("/api/approvals" + (filtro ? "?estado=" + filtro : ""));
  const d = await r.json();
  const l = $("#lista");
  if (!d.approvals.length) { l.innerHTML = '<div class="vazio">Nada aqui.</div>'; return; }
  l.innerHTML = d.approvals.map(a => `
   <div class="card">
    <b>${esc(a.tool)}</b> <span class="meta">${esc(a.state)} · ${new Date(a.created*1000).toLocaleString()} · job ${esc(a.job_id||"-")}</span>
    <pre>${esc(a.preview || JSON.stringify(a.args, null, 2))}</pre>
    ${a.state === "pending" ? `<div class="acoes"><button data-a="approve" data-id="${esc(a.id)}">Aprovar</button>
      <button data-a="reject" data-id="${esc(a.id)}">Rejeitar</button></div>` : ""}
   </div>`).join("");
}
async function jobs() {
  const d = await (await fetch("/api/jobs")).json();
  $("#lista").innerHTML = d.jobs.length ? d.jobs.map(j => `<div class="card"><b>${esc(j.bot)}</b>
    <span class="meta">${esc(j.state)} · ${esc(j.id)} · tentativas ${j.attempts}</span>
    <pre>${esc(typeof j.result === "string" ? j.result : JSON.stringify(j.result ?? j.input, null, 2))}</pre></div>`).join("")
    : '<div class="vazio">Nenhum job.</div>';
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.a) {
    b.disabled = true;
    await fetch(`/api/approvals/${b.dataset.id}/${b.dataset.a}`, {method: "POST"});
    carregar();
  } else if (b.id === "verJobs") { jobs(); }
  else if (b.dataset.e !== undefined) { filtro = b.dataset.e; carregar(); }
});
const ev = new EventSource("/eventos");
ev.onmessage = m => { try { const d = JSON.parse(m.data); if (d.tipo === "aprovacao" && filtro !== null) carregar(); } catch (_) {} };
carregar();
</script>
</body>
</html>
